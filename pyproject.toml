[project]
name = "echochamber"
version = "0.1.0"
description = "Multi-LLM Courtroom Debate Environment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Core has no hard dependencies — providers and features are lazily imported.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]  # Also used for Together.AI and LM Studio
gemini = ["google-genai>=1.0.0"]
search = ["ddgs>=6.0.0"]
ui = ["gradio>=5.0.0"]
pdf = ["pymupdf>=1.24.0"]
rag = ["chromadb>=0.5.0"]
batch = ["pyyaml>=6.0"]
env = ["python-dotenv>=1.0.0"]
all = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "ddgs>=6.0.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[dependency-groups]
dev = [
    # Provider SDKs so the retry tests check the real exception types in CI
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "pytest>=7.0.0",
    "pyyaml>=6.0",  # batch config-loading tests
    "ruff>=0.17.3",
]

[project.scripts]
echochamber = "echochamber.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echochamber*"]

[tool.setuptools.package-data]
echochamber = ["data/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Ruff's classic default set (pyflakes + the pycodestyle errors that never
# conflict with a formatter), plus BLE/S110: an `except Exception` must
# re-raise or log with exc_info, and `except: pass` is not allowed. Kept
# small on purpose: every rule here flags a likely bug, not a style preference.
select = ["E4", "E7", "E9", "F", "BLE", "S110"]
